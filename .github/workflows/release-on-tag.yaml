name: Release on Tag

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        include:
          - os: windows-latest
            artifact_name: PersianSubtitleFixer-Windows
          - os: ubuntu-latest
            artifact_name: PersianSubtitleFixer-Linux
          - os: macos-latest
            artifact_name: PersianSubtitleFixer-macOS
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller==5.13.2 upx
        shell: bash
      - name: Install UPX (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          $upxVersion = "4.2.1"
          $upxZip = "upx-$upxVersion-win64.zip"
          $upxUrl = "https://github.com/upx/upx/releases/download/v$upxVersion/$upxZip"
          Invoke-WebRequest -Uri $upxUrl -OutFile $upxZip
          Expand-Archive -Path $upxZip -DestinationPath .
          echo "$pwd\upx-$upxVersion-win64" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        shell: pwsh
      - name: Install UPX (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y upx-ucl
        shell: bash
      - name: Install UPX (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install upx
        shell: bash
      - name: Build with PyInstaller
        run: pyinstaller --clean PersianSubtitleFixer.spec
      - name: Prepare release directory
        run: |
          mkdir -p release
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp dist/PersianSubtitleFixer/PersianSubtitleFixer.exe release/
          elif [ "$RUNNER_OS" = "macOS" ]; then
            cp -r dist/PersianSubtitleFixer.app release/
          else
            cp dist/PersianSubtitleFixer/PersianSubtitleFixer release/
          fi
        shell: bash
      - name: Generate SHA256 checksum
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            $hash = (Get-FileHash -Algorithm SHA256 -Path release/*).Hash.ToLower()
            $hash | Out-File -FilePath release/sha256.txt -Encoding ascii
          else
            shasum -a 256 release/* | cut -d' ' -f1 > release/sha256.txt
          fi
        shell: bash
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-${{ github.ref_name }}
          path: |
            release/*
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: artifacts/**
