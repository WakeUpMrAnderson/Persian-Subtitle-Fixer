[project]
name = "persian-subtitle-fixer"
version = "0.4.1"
description = "Fix Persian/Arabic subtitle encoding issues in SRT and ASS files"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "PyQt6==6.12.0",
    "PyQt6-sip==13.13.0",
    "chardet==5.2.0"
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "subtitle_processor", "subtitle_fixer_gui"]
