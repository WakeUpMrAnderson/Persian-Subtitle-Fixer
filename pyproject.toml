[project]
name = "persian-subtitle-fixer"
version = "0.1.0"
description = "Fix Persian/Arabic subtitle encoding issues in SRT and ASS files"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "PyQt5==5.15.11",
    "PyQt5-sip>=12.15",
    "chardet==5.2.0"
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "subtitle_processor", "subtitle_fixer_gui"]
